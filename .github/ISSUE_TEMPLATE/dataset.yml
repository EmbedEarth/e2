name: Dataset or provider
description: Suggest a dataset or source integration
title: "[Dataset]: "
labels: [dataset]
body:
  - type: input
    id: source
    attributes:
      label: Source URL
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Coverage and license
      description: Include geography, temporal coverage, refresh cadence, license, and attribution.
    validations:
      required: true
